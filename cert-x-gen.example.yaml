# CERT-X-GEN Example Configuration
#
# Copy this file to cert-x-gen.yaml and pass it with `--config cert-x-gen.yaml`.
# Generate a fresh copy any time with: cxg config generate --output cert-x-gen.yaml
#
# Every key below has a runtime effect. (Dead configuration keys were removed in
# v1.3.0 — old config files that still set them continue to load; the extra keys
# are simply ignored.)

# Template discovery and execution
templates:
  # Extra template directories to search (in addition to the built-in discovery
  # roots). Empty = discovery only.
  directories: []
  # Per-template execution timeout, in seconds.
  timeout_secs: 30

# HTTP client behaviour
network:
  # Request timeout, in seconds.
  timeout_secs: 10
  # User-Agent header sent with every request.
  user_agent: cert-x-gen/1.2.0
  # Maximum redirect hops (only relevant when redirect-following is enabled).
  # NOTE: whether redirects are followed is controlled by the --follow-redirects
  # CLI flag, not this file.
  max_redirects: 5
  # HTTP connection pool size.
  connection_pool_size: 100
  # Proxy URL (http/https/socks5), or null for none.
  proxy: null
  # Requests per second, or null for unlimited.
  rate_limit: 100
  # Extra request headers, as [name, value] pairs.
  headers: []
  # Cookies for authenticated scans, as [name, value] pairs.
  cookies: []

# Concurrency and retries
execution:
  # Concurrent targets scanned at once.
  parallel_targets: 50
  # Concurrent templates run per target.
  parallel_templates: 10
  # Retry attempts for transient failures.
  max_retries: 1
  # Delay between retries, in seconds.
  retry_delay_secs: 1
  # Aggressive mode: higher concurrency, drops rate limiting.
  aggressive_mode: false
  # Stealth mode: adds request jitter/delay.
  stealth_mode: false

# Sandbox dependency-environment settings.
# NOTE: these keys do NOT confine template execution (templates run as ordinary
# child processes with your privileges). They are retained pending a separate
# sandbox workstream; see docs/SANDBOX_GUIDE.md.
sandbox:
  enabled: true
  memory_limit_mb: 512
  cpu_limit_percent: 80
  network_access: controlled
  filesystem_access: readonly
