name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-flight run only when a newer run is for the SAME pull request.
# The group key is the PR number on a pull_request event; on a push it falls
# through to github.run_id, which is unique per run, so every main build sits
# alone in its own group and can never be cancelled by a later merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Pull requests share one Rust toolchain and cache for formatting, linting and
  # tests. Clippy checks the crate too, so a separate cargo check is redundant.
  # The main-integrity ruleset must migrate its old Rust contexts to `Rust`
  # when this change merges; keep `Test (macos-latest)` required as before.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features -- -W clippy::all
      - run: cargo test --all-features

  # Windows coverage runs after merge, with a standalone job so pull requests
  # show a visible skip rather than silently omitting a matrix leg.
  test-windows:
    name: Test (windows-latest)
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # macOS is a 10x-billed runner and was the largest line in the CI bill, so it
  # is merge-only: it runs on main and on tags, and is SKIPPED on pull requests.
  # That is a deliberate, accepted reduction in pull-request coverage, not an
  # oversight — a macOS-specific regression is now caught after merge, not before.
  #
  # It is a job of its own rather than a matrix leg so that the skip is VISIBLE:
  # a skipped job still appears in the run graph and still reports a check run,
  # whereas a matrix leg removed by an expression would simply be absent.
  #
  # The name is `Test (macos-latest)` verbatim, matching the check name the
  # three-OS matrix used to produce, because that exact context is a required
  # status check in the `main-integrity` ruleset. Renaming it would leave that
  # required check with nothing to report and deadlock every pull request.
  # See the pull request for what the skip does to that requirement.
  test-macos:
    name: Test (macos-latest)
    runs-on: macos-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # The Python orchestrator under pentest/ had never run in CI: every job above
  # is cargo, and there was no dependency manifest to install. This job closes
  # that gap. Node is installed because a set of config-probe regression tests
  # evaluate the shipped renderer check expressions as real JavaScript against
  # modelled Electron renderer environments — without it they skip, which is
  # exactly the coverage that catches a probe reporting an insecure app as safe.
  #
  # Python 3.12 and 3.13 are both verified green. 3.11 is deliberately excluded:
  # tests/test_electron_substrate.py monkeypatches os.name to "nt", and on 3.11
  # pathlib.Path() dispatches on os.name at instantiation and raises
  # NotImplementedError for WindowsPath on a POSIX host. That is a pre-existing
  # test/interpreter interaction, unrelated to anything this job runs.
  pentest:
    name: Pentest (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pentest/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --upgrade pip
      - run: pip install -r pentest/requirements.txt
      # Track B's `auth verify` liveness tests drive a real headless Chromium;
      # the pip package ships no browser binary. Install it (with OS deps) so
      # those tests run against the same substrate a real `auth verify --ci` does.
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -v
        working-directory: pentest

  # Python 3.13 covers pull requests; 3.12 remains a merge-only compatibility
  # check. Keep it standalone so the skipped coverage is visible on each PR.
  pentest-python312:
    name: Pentest (Python 3.12)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pentest/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --upgrade pip
      - run: pip install -r pentest/requirements.txt
      # Track B's `auth verify` liveness tests drive a real headless Chromium;
      # the pip package ships no browser binary. Install it (with OS deps) so
      # those tests run against the same substrate a real `auth verify --ci` does.
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -v
        working-directory: pentest

  # This job compiles the four release targets and uploads them as run
  # artifacts; it is a cross-platform compile smoke test. The artefacts a
  # RELEASE ships come from release.yml, which triggers on a `v*` tag and is
  # untouched here — nothing in this file can stop a release being built.
  #
  # Two of its four legs are macOS at a 10x multiplier, which made it the single
  # largest line in the bill. A pull request is served by the combined `rust`
  # job on Linux; compiling release binaries for four
  # platforms on every push to a draft pull request is not what it needs.
  #
  # The condition is on github.ref rather than github.event_name so that it
  # reads as "main and tags" regardless of how the workflow is triggered. On a
  # pull_request event github.ref is `refs/pull/<n>/merge`, so neither arm
  # matches and the whole job is visibly SKIPPED in the run graph.
  build:
    name: Build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cxg
          # Use macos-15-intel for x86_64 builds (the only free Intel runner available)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: cxg
          # Use macos-latest (ARM64) for aarch64 builds
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: cxg
          # Windows MSVC build (binary has a .exe suffix)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cxg.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      # Same transient-timeout retry as release.yml's build job.
      - id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: cxg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
      - if: steps.upload.outcome == 'failure'
        shell: bash
        run: sleep 60
      - if: steps.upload.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cxg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          overwrite: true
