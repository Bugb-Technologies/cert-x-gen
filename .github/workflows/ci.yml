name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-features -- -W clippy::all

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features

  # The Python orchestrator under pentest/ had never run in CI: every job above
  # is cargo, and there was no dependency manifest to install. This job closes
  # that gap. Node is installed because a set of config-probe regression tests
  # evaluate the shipped renderer check expressions as real JavaScript against
  # modelled Electron renderer environments — without it they skip, which is
  # exactly the coverage that catches a probe reporting an insecure app as safe.
  #
  # Python 3.12 and 3.13 are both verified green. 3.11 is deliberately excluded:
  # tests/test_electron_substrate.py monkeypatches os.name to "nt", and on 3.11
  # pathlib.Path() dispatches on os.name at instantiation and raises
  # NotImplementedError for WindowsPath on a POSIX host. That is a pre-existing
  # test/interpreter interaction, unrelated to anything this job runs.
  pentest:
    name: Pentest (Python)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pentest/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install --upgrade pip
      - run: pip install -r pentest/requirements.txt
      - run: python -m pytest -v
        working-directory: pentest

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: cxg
          # Use macos-15-intel for x86_64 builds (the only free Intel runner available)
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bin: cxg
          # Use macos-latest (ARM64) for aarch64 builds
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: cxg
          # Windows MSVC build (binary has a .exe suffix)
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: cxg.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: cxg-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
